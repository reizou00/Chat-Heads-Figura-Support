modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    logoFile="icon.png"
    credits="Shotadft"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId="figura"
mandatory=true
versionRange="[0.1.5,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="chat_heads"
mandatory=true
versionRange="[0.15.2,)"
ordering="AFTER"
side="CLIENT"