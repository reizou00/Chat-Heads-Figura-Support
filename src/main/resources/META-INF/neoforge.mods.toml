
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png" #optional
credits="Shotadft" #optional
authors="reizou_00"

description='''
Replaces Chat Heads' player heads with your active Figura avatar's face.
'''

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId="figura"
mandatory=true
versionRange="[0.1.5,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="chat_heads"
mandatory=true
versionRange="[0.15.2,)"
ordering="AFTER"
side="CLIENT"